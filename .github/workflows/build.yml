name: Build & Release EXE

on:
  workflow_dispatch:
    inputs:
      tag:
        description: '版本号 (例如 v1.0.1)'
        required: true
        default: 'v1.0.1'
      prerelease:
        description: '是否为预发布版本'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install requests pillow pystray pyinstaller

      - name: Build EXE
        run: >
          pyinstaller --onefile --noconsole --clean --name AuEye
          --icon=gold_icon.ico aueye.py
          --collect-all vcruntime
          --collect-all _tkinter
          --exclude-module numpy --exclude-module tkinter.test
          --exclude-module setuptools --exclude-module distutils
          --exclude-module pip --exclude-module pkg_resources
          --exclude-module pandas --exclude-module akshare
          --exclude-module lxml --exclude-module bs4
          --exclude-module curl_cffi --exclude-module mini_racer

      - name: Package into ZIP
        run: Compress-Archive -Path dist\AuEye.exe -DestinationPath dist\AuEye.zip

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create ${{ inputs.tag }} `
            dist/AuEye.zip `
            --repo ${{ github.repository }} `
            --title "AuEye ${{ inputs.tag }}" `
            --generate-notes `
            ${{ inputs.prerelease && '--prerelease' || '' }}
