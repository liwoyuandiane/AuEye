name: Build & Release EXE

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install requests pillow pystray pyinstaller

      - name: Build EXE
        run: >
          pyinstaller --onefile --noconsole --strip --name AuEye
          --icon=gold_icon.ico aueye.py
          --exclude-module numpy --exclude-module tkinter.test
          --exclude-module setuptools --exclude-module distutils
          --exclude-module pip --exclude-module pkg_resources

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/AuEye.exe
          draft: false
          prerelease: false
