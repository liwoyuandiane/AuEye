name: Build & Release EXE

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install requests pillow pystray pyinstaller

      - name: Build EXE
        run: >
          pyinstaller --onefile --noconsole --clean --name AuEye
          --icon=gold_icon.ico aueye.py
          --collect-all vcruntime
          --collect-all _tkinter
          --exclude-module numpy --exclude-module tkinter.test
          --exclude-module setuptools --exclude-module distutils
          --exclude-module pip --exclude-module pkg_resources

      - name: Package into ZIP
        run: Compress-Archive -Path dist\AuEye.exe -DestinationPath dist\AuEye.zip

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create ${{ github.ref_name }} `
            dist/AuEye.zip `
            --repo ${{ github.repository }} `
            --title "AuEye ${{ github.ref_name }}" `
            --generate-notes
